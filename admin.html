<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101b17" />
    <title>Flowers · Super Admin</title>
    <link rel="stylesheet" href="/admin.css" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <main id="adminApp" hidden>
      <header>
        <div><h1>Flowers <span id="roleTitle">Admin</span></h1><p>Магазины, подписки и состояние платформы</p></div>
        <div class="badge" id="roleBadge">ПРОВЕРКА ДОСТУПА</div>
      </header>
      <div class="stats">
        <div class="card"><span id="shopsLabel">Магазины</span><strong id="shopsCount">—</strong></div>
        <div class="card"><span id="mrrLabel">MRR</span><strong id="mrr">—</strong></div>
        <div class="card"><span id="activeLabel">Активные подписки</span><strong id="activeCount">—</strong></div>
        <div class="card"><span>Заказы</span><strong id="ordersCount">—</strong></div>
      </div>
      <section>
        <div class="section-head">
          <div><h2>Подключённые магазины</h2><p id="summaryLine">Загрузка…</p></div>
        </div>
        <table>
          <thead><tr><th>Магазин</th><th>Бот</th><th>Тариф</th><th>Подписка</th><th>Оплачено до</th><th>Бот</th><th>Заказы</th></tr></thead>
          <tbody id="shopsTable"></tbody>
        </table>
        <div class="empty" id="empty" hidden>Магазины ещё не подключены.</div>
      </section>
      <p class="hint">Токены ботов и платёжные секреты здесь намеренно не показываются.</p>
    </main>
    <script type="module" src="/admin.js"></script>
  </body>
</html>
